<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.logo-wrap {
  position: relative;
  width: 120px;
  height: 120px;
}

.logo-img {
  width: 100%;
  height: 100%;
  display: block;
}

.dot {
  position: absolute;
  left: 0;
  top: 0;

  width: 10px;
  height: 10px;
  background: #22c55e;
  border-radius: 999px;
  box-shadow: 0 0 10px #22c55e;

  offset-path: path("M50 105 C18 82 18 25 50 10");
  offset-distance: 0%;
  offset-rotate: 0deg;

  animation: moveDot 2s linear infinite;
}

@keyframes moveDot {
  from {
    offset-distance: 0%;
  }
  to {
    offset-distance: 100%;
  }
}
</style>
<body>
    <div className="logo-wrap">
        <img src="/logo.jpeg" className="logo-img" />
        <div className="dot"></div>
    </div>
</body>
</html>
